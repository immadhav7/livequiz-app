services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: livequiz
      MYSQL_USER: livequiz
      MYSQL_PASSWORD: livequiz
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: livequiz-app:local
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: livequiz
      DB_USER: livequiz
      DB_PASSWORD: livequiz
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
