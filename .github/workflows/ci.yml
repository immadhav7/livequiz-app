# CI: build and test, publish the image to GHCR, then update the dev image tag in the deploy repo
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  image:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Compute image name and tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/livequiz-app" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Build image
        env:
          REPO: ${{ github.repository }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${REPO}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${TAG}" .

      - name: Push image
        run: docker push "${IMAGE}:${TAG}"

  update-deploy-repo:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up SSH access to the deploy repo
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update the dev image tag
        run: |
          TAG="${GITHUB_SHA::7}"
          git clone "git@github.com:${GITHUB_REPOSITORY_OWNER}/livequiz-deploy.git"
          cd livequiz-deploy
          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" helm/livequiz/values-dev.yaml
          git config user.name "livequiz-ci"
          git config user.email "ci@users.noreply.github.com"
          if git diff --quiet; then
            echo "Tag is already ${TAG}; nothing to commit"
          else
            git commit -am "ci: deploy livequiz-app ${TAG} to dev"
            git push
          fi
